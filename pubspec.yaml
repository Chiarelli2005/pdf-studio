name: pdf_studio
description: "PDF Studio - Editor, Annotator e Compilatore PDF per Android"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # PDF rendering con accesso alla matrice di trasformazione (zoom-aware)
  # Prima era: pdfrx: 0.4.46
  pdfrx: ^1.3.5

  # PDF manipulation (export, metadati, cifratura)
  syncfusion_flutter_pdf: ^27.1.48

  # File I/O & system
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  share_plus: ^10.1.2
  open_filex: ^4.5.0

  # Stampa nativa Android (rilevamento stampanti via Android Print
  # Framework: WiFi, cloud, USB, salva-come-PDF)
  printing: ^5.13.4

  # Selezione immagini dalla galleria/fotocamera (annotazione immagine)
  image_picker: ^1.1.2

  # Parsing DOCX (lo .docx e' uno ZIP di XML) per conversione Word -> PDF
  archive: ^3.6.1
  xml: ^6.5.0

  # Apertura PDF da altre app (intent ricevuti)
  receive_sharing_intent: ^1.8.1

  # UI / UX
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.1.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Configurazione icona app. Per applicarla:
#   1. Metti l'icona in assets/icon/app_icon.png (consigliato 1024x1024)
#   2. flutter pub get
#   3. dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  # Sfondo adattivo nero, coerente con l'icona PDF (sfondo nero pieno):
  # evita aloni quando Android applica maschere circolari/squircle.
  adaptive_icon_background: "#000000"
  # Foreground dedicato: l'icona e' gia' scalata nella safe zone (~70%)
  # cosi' Android non la ritaglia ai bordi.
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
